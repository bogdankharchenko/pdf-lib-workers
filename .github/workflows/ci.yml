name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Fails if openapi.json is out of date; run `npm run openapi` and commit the result.
      - run: npm test
      # Checks openapi.json against the OpenAPI rules most tools enforce (Spectral's oas ruleset).
      - run: npm run lint:openapi
      - name: Build the Worker bundle
        run: npx wrangler deploy --dry-run --outdir dist
